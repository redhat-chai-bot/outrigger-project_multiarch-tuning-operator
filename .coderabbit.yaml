language: en
reviews:
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    path_filters:
      - "!zz_generated.deepcopy.go"
      - "!config/crd/bases/**"
      - "!config/rbac/role.yaml"
      - "!bundle/**"
      - "!vendor/**"
      - "!go.sum"
    path_instructions:
      - path: "api/v1beta1/**"
        instructions: |
          Review CRD type changes per REVIEW.md "api/v1beta1/" rules.
          Check kubebuilder markers, conversion functions, validation.
      - path: "internal/controller/podplacement/**"
        instructions: |
          High-churn core logic. Review per REVIEW.md "internal/controller/podplacement/" rules.
          Check shouldIgnorePod(), nodeAffinity mutations, scheduling gate handling.
      - path: "internal/controller/operator/**"
        instructions: |
          Review per REVIEW.md "internal/controller/operator/" rules.
          Check operand resource construction, status conditions, ordered deletion.
      - path: "pkg/image/**"
        instructions: |
          Review per REVIEW.md "pkg/image/" rules.
          Check registry auth, cache logic, manifest parsing.
      - path: "api/common/plugins/**"
        instructions: |
          Review per REVIEW.md "api/common/plugins/" rules.
          CEL expressions metadata-only, architecture enums, weight ranges.
  tools:
    github-checks:
      enabled: true
chat:
  auto_reply: true
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  jira:
    project_keys: []
  linear:
    team_keys: []
  pull_requests:
    scope: auto
  opt_out: false
